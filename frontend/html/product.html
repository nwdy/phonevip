<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Thông tin sản phẩm</title>
</head>
<body>
    <header>
        <img src="../images/banner.png" alt="banner">
    </header>

    <nav>
        <div class="nav-container">
            <ul>
                <li><a href="index.html"><img src="../images/home.png" alt="home", width="50">Trang chủ</a></li>
                <li><input type="text" placeholder="Bạn muốn tìm"><img src="../images/search.png" alt="search", width="15"></li>
                <li><a href="cart.html"><img src="../images/store.png" alt="store", width="50">Giỏ hàng</a></li>
                <li><a href=""><img src="../images/danhgia.png" alt="store", width="50">Rating</a></li>
                <li><a href=""><img src="../images/order.png" alt="order", width="50">Đơn hàng</a></li>
                <li><a href="account.html"><img src="../images/user.png" alt="user", width="50">Tài khoản</a></li>
                <li><a href="./login.html"><img src="../images/logout.png" alt="logout", width="50">Đăng xuất</a></li>
            </ul>
        </div>
    </nav>

    <div class="chatbot">
        <a href=""><img src="../images/chatbot.png" alt="chatbot"></a>
    </div>
    
    <div class="information">
        <div class="product-title">
            Samsung Galaxy S25 Ultra 12GB 1TB Xanh lam
        </div>

        <div class="product-details">
            <div class="left">
                <div class="product-image">
                    <img src="../images/dienthoai.png" alt="s25 ultra 12gb 1tb">
                </div>
            </div>
            
            <div class="right">
                <div class="product-info">
                    <p>5 sao | 50 rating</p>
    
                    <div class="price">
                        30.000.000 đ
                    </div>
    
                    <div class="quantity">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
    
                    <div class="buy-button">
                        <button>Mua ngay</button>
                        <button>Thêm vào giỏ hàng</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="product-description">
            <p>Thông tin sản phẩm:</p>
        </div>
    </div>
</body>
</html>
