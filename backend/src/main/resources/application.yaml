spring:
  application:
    name: phonevip-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/phonevip
    username: postgres
    password: 12345678

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
#      schema-locations: schema.sql
      data-locations: classpath:data.sql
